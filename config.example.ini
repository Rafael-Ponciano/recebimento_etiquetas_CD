SHEETS_STATUS_FEITO = FEITO
SHEETS_STATUS_PARCIAL = FALTANDO ITEM
IMPRIMIR_EM_PARCIAL = false

# --- SMTP (recuperação de senha por e-mail) ---
SMTP_HOST = smtp.gmail.com
SMTP_PORT = 587
SMTP_USER =
SMTP_PASSWORD =
SMTP_FROM =
SMTP_USE_TLS = true

# --- Atualização automática (Supabase Storage) ---
